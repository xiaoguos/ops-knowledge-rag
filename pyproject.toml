[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-knowledge-rag"
version = "1.0.0"
description = "Evidence-first operations knowledge assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<1", "uvicorn>=0.53,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20", "sqlalchemy>=2.0.54,<3", "psycopg[binary]>=3.3,<4", "pwdlib[argon2]>=0.3,<1", "alembic>=1.20,<2", "pypdf>=6.18,<7", "python-docx>=1.2,<2", "numpy>=2,<3", "fastembed>=0.8,<1", "pgvector>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["fastembed>=0.7,<1"]
ocr = ["rapidocr>=3.8,<4", "onnxruntime>=1.20,<2", "pypdfium2>=4.30,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
