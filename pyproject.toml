[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-knowledge-rag"
version = "0.1.0"
description = "Evidence-first operations knowledge assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.20", "numpy>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["fastembed>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

