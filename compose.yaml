services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - model-cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    init: true
    mem_limit: 3g
    stop_grace_period: 30s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - model-cache:/app/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    init: true
    mem_limit: 3g
    stop_grace_period: 120s
    healthcheck:
      disable: true

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-api.example.com}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  model-cache:
  caddy-data:
  caddy-config:
