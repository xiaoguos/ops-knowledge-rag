name: Verify and publish interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:ci-test-only-password@localhost:5432/test
      DATABASE_URL: postgresql+psycopg://test:ci-test-only-password@localhost:5432/test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install ".[dev]"
      - name: Unit and real PostgreSQL integration tests
        run: python -m pytest -q
      - name: Frontend syntax and no demo entrypoints
        run: |
          npm test
          test ! -f web/demo.js
          test ! -f web/demo-data.json
      - name: Apply immutable migration
        run: |
          alembic upgrade head
          alembic current
      - name: Build deployable image
        run: docker build -t enterprise-app .
      - name: API and worker smoke test (no model inference claim)
        run: |
          docker run -d --name api --network host -e DATABASE_URL -e APP_ENV enterprise-app
          docker run -d --name worker --network host -e DATABASE_URL -e APP_ENV enterprise-app python -m app.worker
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/api/ready; then exit 0; fi
            sleep 2
          done
          docker logs api
          docker logs worker
          exit 1
      - name: Capture logs
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish frontend only
        id: deployment
        uses: actions/deploy-pages@v4
